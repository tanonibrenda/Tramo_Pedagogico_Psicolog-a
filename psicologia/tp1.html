<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trabajo Grupal N°1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>
<body>
    <section>
        <svg viewBox="0 0 1000 900" xmlns="http://www.w3.org/2000/svg">
            <!-- Fondo principal -->
            <rect width="1000" height="900" fill="#f9f9f9"/>
            
            <!-- Título principal -->
            <rect x="300" y="20" width="400" height="60" rx="10" fill="#5b6d7c"/>
            <text x="500" y="55" font-family="Arial, sans-serif" font-size="22" fill="white" text-anchor="middle" font-weight="bold">IDENTIDAD SEXUAL Y DE GÉNERO</text>
            <text x="500" y="75" font-family="Arial, sans-serif" font-size="16" fill="white" text-anchor="middle">Evolución histórica según Adrián Grassi</text>
          
            <!-- Sección 1: Paradigma Modernidad -->
            <rect x="100" y="120" width="250" height="180" rx="10" fill="#e6f2e6"/>
            <text x="225" y="145" font-family="Arial, sans-serif" font-size="18" fill="#333" text-anchor="middle" font-weight="bold">PARADIGMA MODERNIDAD</text>
            
            <rect x="110" y="160" width="230" height="130" rx="5" fill="#c5e0c5"/>
            <text x="125" y="180" font-family="Arial, sans-serif" font-size="14" fill="#333">• Soldadura entre sexo y género</text>
            <text x="125" y="205" font-family="Arial, sans-serif" font-size="14" fill="#333">• Determinismo biológico</text>
            <text x="125" y="230" font-family="Arial, sans-serif" font-size="14" fill="#333">• Polaridad irreductible entre</text>
            <text x="135" y="250" font-family="Arial, sans-serif" font-size="14" fill="#333">identidades genéricas</text>
            <text x="125" y="275" font-family="Arial, sans-serif" font-size="14" fill="#333">• Patologización de lo divergente</text>
          
            <!-- Sección 2: Corrientes Contemporáneas -->
            <rect x="650" y="120" width="250" height="180" rx="10" fill="#f9e6e6"/>
            <text x="775" y="145" font-family="Arial, sans-serif" font-size="18" fill="#333" text-anchor="middle" font-weight="bold">CORRIENTES CONTEMPORÁNEAS</text>
            
            <rect x="660" y="160" width="230" height="130" rx="5" fill="#f1d1d1"/>
            <text x="675" y="180" font-family="Arial, sans-serif" font-size="14" fill="#333">• Estudios de género (Money)</text>
            <text x="675" y="205" font-family="Arial, sans-serif" font-size="14" fill="#333">• Feminismo (Butler)</text>
            <text x="675" y="230" font-family="Arial, sans-serif" font-size="14" fill="#333">• Estudios Queer</text>
            <text x="675" y="255" font-family="Arial, sans-serif" font-size="14" fill="#333">• Revuelta del orden simbólico</text>
            <text x="675" y="280" font-family="Arial, sans-serif" font-size="14" fill="#333">• Autopercepción del género</text>
          
            <!-- Flecha de transición -->
            <line x1="360" y1="210" x2="640" y2="210" stroke="#5b6d7c" stroke-width="3" stroke-dasharray="5,5"/>
            <polygon points="640,210 630,205 630,215" fill="#5b6d7c"/>
          
            <!-- Sección 3: Construcción de la Identidad -->
            <rect x="100" y="340" width="800" height="200" rx="10" fill="#dbe9f6"/>
            <text x="500" y="365" font-family="Arial, sans-serif" font-size="18" fill="#333" text-anchor="middle" font-weight="bold">CONSTRUCCIÓN DE LA IDENTIDAD SEGÚN EL PSICOANÁLISIS</text>
            
            <!-- Subsección 3.1 -->
            <rect x="110" y="380" width="250" height="150" rx="5" fill="#c4d7ed"/>
            <text x="235" y="400" font-family="Arial, sans-serif" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">Procesos Originarios</text>
            <text x="125" y="425" font-family="Arial, sans-serif" font-size="14" fill="#333">• Narcisismo primario</text>
            <text x="125" y="450" font-family="Arial, sans-serif" font-size="14" fill="#333">• Imagen Inconsciente del Cuerpo</text>
            <text x="125" y="475" font-family="Arial, sans-serif" font-size="14" fill="#333">• Reconocimiento especular</text>
            <text x="125" y="500" font-family="Arial, sans-serif" font-size="14" fill="#333">• Proceso vincular con la madre</text>
            <text x="125" y="525" font-family="Arial, sans-serif" font-size="14" fill="#333">• Consolidación a los 3 años</text>
            
            <!-- Subsección 3.2 -->
            <rect x="375" y="380" width="250" height="150" rx="5" fill="#c4d7ed"/>
            <text x="500" y="400" font-family="Arial, sans-serif" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">Dos Tiempos de la Sexualidad</text>
            <text x="390" y="425" font-family="Arial, sans-serif" font-size="14" fill="#333">• Sexualidad infantil (pregenital)</text>
            <text x="390" y="450" font-family="Arial, sans-serif" font-size="14" fill="#333">• Sexualidad adulta (genital)</text>
            <text x="390" y="475" font-family="Arial, sans-serif" font-size="14" fill="#333">• Entretiempo puberal-adolescente</text>
            <text x="390" y="500" font-family="Arial, sans-serif" font-size="14" fill="#333">• Resignificación de la infancia</text>
            <text x="390" y="525" font-family="Arial, sans-serif" font-size="14" fill="#333">• Carácter inconcluso en la infancia</text>
            
            <!-- Subsección 3.3 -->
            <rect x="640" y="380" width="250" height="150" rx="5" fill="#c4d7ed"/>
            <text x="765" y="400" font-family="Arial, sans-serif" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">Pubertad/Adolescencia</text>
            <text x="655" y="425" font-family="Arial, sans-serif" font-size="14" fill="#333">• Caracteres sexuales secundarios</text>
            <text x="655" y="450" font-family="Arial, sans-serif" font-size="14" fill="#333">• Cuerpo genital (Gutton)</text>
            <text x="655" y="475" font-family="Arial, sans-serif" font-size="14" fill="#333">• Reformulación del Yo</text>
            <text x="655" y="500" font-family="Arial, sans-serif" font-size="14" fill="#333">• Exterioridad a lo familiar</text>
            <text x="655" y="525" font-family="Arial, sans-serif" font-size="14" fill="#333">• Espacio intergeneracional</text>
          
            <!-- Sección 4: Puntos Críticos Actuales -->
            <rect x="100" y="580" width="800" height="280" rx="10" fill="#f0e6f5"/>
            <text x="500" y="605" font-family="Arial, sans-serif" font-size="18" fill="#333" text-anchor="middle" font-weight="bold">PUNTOS CRÍTICOS EN LA CONSTRUCCIÓN DE LA IDENTIDAD SEXUAL/GÉNERO</text>
            
            <!-- Subsección 4.1 -->
            <rect x="110" y="625" width="250" height="225" rx="5" fill="#e0d1e6"/>
            <text x="235" y="645" font-family="Arial, sans-serif" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">Autopercepción y Certeza</text>
            <text x="125" y="670" font-family="Arial, sans-serif" font-size="14" fill="#333">• Engaño de la autopercepción</text>
            <text x="125" y="695" font-family="Arial, sans-serif" font-size="14" fill="#333">• Yo como lugar de desconocimiento</text>
            <text x="125" y="720" font-family="Arial, sans-serif" font-size="14" fill="#333">• La certeza como alerta clínica</text>
            <text x="125" y="745" font-family="Arial, sans-serif" font-size="14" fill="#333">• Negativismo psicótico</text>
            <text x="125" y="770" font-family="Arial, sans-serif" font-size="14" fill="#333">• Renegación de la realidad corporal</text>
            <text x="125" y="795" font-family="Arial, sans-serif" font-size="14" fill="#333">• Salida de la cadena filiatoria</text>
            <text x="125" y="820" font-family="Arial, sans-serif" font-size="14" fill="#333">• Falso self (Winnicott)</text>
            
            <!-- Subsección 4.2 -->
            <rect x="375" y="625" width="250" height="225" rx="5" fill="#e0d1e6"/>
            <text x="500" y="645" font-family="Arial, sans-serif" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">Marco Jurídico Actual</text>
            <text x="390" y="670" font-family="Arial, sans-serif" font-size="14" fill="#333">• Ley de Identidad de Género (2012)</text>
            <text x="390" y="695" font-family="Arial, sans-serif" font-size="14" fill="#333">• Capacidad progresiva del niño</text>
            <text x="390" y="720" font-family="Arial, sans-serif" font-size="14" fill="#333">• Interés superior del niño/a</text>
            <text x="390" y="745" font-family="Arial, sans-serif" font-size="14" fill="#333">• Rectificación registral</text>
            <text x="390" y="770" font-family="Arial, sans-serif" font-size="14" fill="#333">• Cambio de nombre e imagen</text>
            <text x="390" y="795" font-family="Arial, sans-serif" font-size="14" fill="#333">• Judicialización vs. respeto de</text>
            <text x="400" y="820" font-family="Arial, sans-serif" font-size="14" fill="#333">  derechos</text>
            
            <!-- Subsección 4.3 -->
            <rect x="640" y="625" width="250" height="225" rx="5" fill="#e0d1e6"/>
            <text x="765" y="645" font-family="Arial, sans-serif" font-size="16" fill="#333" text-anchor="middle" font-weight="bold">Propuesta de Abordaje</text>
            <text x="655" y="670" font-family="Arial, sans-serif" font-size="14" fill="#333">• Derecho de espera</text>
            <text x="655" y="695" font-family="Arial, sans-serif" font-size="14" fill="#333">• Identidad de género en tránsito</text>
            <text x="655" y="720" font-family="Arial, sans-serif" font-size="14" fill="#333">• Tránsito por ambigüedades sexuales</text>
            <text x="655" y="745" font-family="Arial, sans-serif" font-size="14" fill="#333">• No apresurar definiciones</text>
            <text x="655" y="770" font-family="Arial, sans-serif" font-size="14" fill="#333">• Acompañamiento interdisciplinario</text>
            <text x="655" y="795" font-family="Arial, sans-serif" font-size="14" fill="#333">• Importancia de los 18 años como</text>
            <text x="665" y="820" font-family="Arial, sans-serif" font-size="14" fill="#333">  momento propicio para definiciones</text>
          
            <!-- Conexiones entre secciones -->
            <line x1="500" y1="80" x2="500" y2="120" stroke="#5b6d7c" stroke-width="2"/>
            <line x1="500" y1="300" x2="500" y2="340" stroke="#5b6d7c" stroke-width="2"/>
            <line x1="500" y1="540" x2="500" y2="580" stroke="#5b6d7c" stroke-width="2"/>
          </svg>
    </section>
    <div class="mx-4">
        <button type="button" class="btn btn-warning"><a href="./psicologiadesarrollo.html">Volver</a></button>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js" integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq" crossorigin="anonymous"></script>
</body>
</html>
